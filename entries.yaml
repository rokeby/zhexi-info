site:
  heading_html: <em>Under Construction</em><br><br>***<br><br>
  news: [Working on a new book with Berggruen Press., 'Joined the <a href="https://www.rca.ac.uk/">Royal College of Art</a> as Tutor (Research) in Contemporary Art Practice.', 'Leading a working group for Organismo @ <a href="https://www.tba21.org/">TBA21 Academy</a> on climate resilience and intervention in the Western Mediterranean, with BC3 and EEAS (part one, 2026).', Advisor for the 2026 Hyundai Artlab Writing Fellowship]
  bio_html: "Gary Zhexi Zhang's work explores systemic connections between cosmology, technology and economy. He operates individually, in collaboration and within organisational frameworks. He recently edited a book of fictions, essays and interviews about finance and time, Catastrophe Time! (Strange Attractor Press, 2023). Dead Cat Bounce, the opera he co-created with Waste Paper Opera, premiered at Somerset House in 2022 and toured in 2024. His projects investigate the production and mediation of geopolitical imagination, particularly through forms of arbitrage across time, cultural and technical systems.<br><br>\n\n        He currently holds the position of Tutor (Research) at the Royal College of Art, London, having previously held positions at Goldsmith's, Chelsea and Parsons. In 2026, he leads part of the Organismo programme at TBA21-Academy researching climate politics, in collaboration with Basque Centre for Climate Change and the European External Action Service, and also serves as an Advisor for the Hyundai Artlab Editorial Fellowship.<br><br>\n\n        Recent solo exhibitions and commissions include Metamers at EPFL Pavilions, Lausanne; the Asian Art Biennial, Taichung; Sea Art Festival, Busan; Art Gallery of York University, Toronto. His work has been shown in group exhibitions at Domoheon Busan; Zentrum für Kreativ Wirtschaft, Kassel; Power Station of Art, Shanghai; Powerhouse Parramatta, Sydney (upcoming); Somerset House, London (upcoming). His work has been supported by residencies and fellowships at La Becque, Rockbund Art Museum, EPFL, Sakiya, Delfina Foundation and Amant (upcoming). His articles have been published for Frieze, ArtReview, Verge Journal of Global Asias, Journal of Cultural Economy, MIT Journal of Design and Science, e-flux, Noema; catalogue essays for Jenna Sutela, Auckland Gallery of Art, Steve Bishop, Anicka Yi and the New Museum; and books including Against Reduction (MIT Press, 2021), Incomputable Earth (Bloomsbury, 2026), Platforms: Around, In Between and Through (Singapore Biennale, 2023); Future Art Ecosystems III &amp; IV (co-author; Serpentine, 2022 &amp; 2024). In 2025 he led a report on art and technology in China for the British Council. He is currently writing a book about multipolar technocultures."
  affiliations: ['Tutor (Research), Contemporary Art Practice, <a href="https://www.rca.ac.uk/">Royal College of Art</a>, London.', 'Resident at <a href="https://www.somersethouse.org.uk/residents/gary-zhexi-zhang">Somerset House Studios</a>, with support from <a href="https://www.instagram.com/kyrin_c_/">Kyrin Chen</a>.', 'Co-founder of <a href="https://www.foreignobjects.net">Foreign Objects</a> (dormant).', 'Ongoing relationships with <a href="https://www.wastepaperopera.net">Waste Paper Opera</a>, <a href="https://trust.support">Trust</a>, <a href="https://www.sakiya.org">Sakiya</a>, O.W.L., <a href="https://weirdeconomies.com">Weird Economies</a>, <a href="https://futureartecosystems.org/">Serpentine Arts Technologies</a>, <a href="https://www.otherinter.net">Other Internet</a>, <a href="https://www.aicauk.org/our-members/user/303/">AICA</a>.', 'Previously: lecturer @ Goldsmiths MFA, PhD ext. examiner @ RCA, resident @ <a href="https://www.newinc.org">NEW INC</a>, p/t lecturer @ Parsons, Fellow @ Berggruen Institute, Delfina Foundation, Wysing, MIT ACT.']
  links: ['<a href="https://www.are.na/zhexi-zhang">are.na</a>', '<a href="mailto:gary@zhexi.info">email</a>', '<a href="https://www.twitter.com/garyzhexizhang">twitter</a>', '<a href="https://www.instagram.com/garyzhexizhang">instagram</a>']
